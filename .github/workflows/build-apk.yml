name: Build JSK Accounting Master APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project ZIP
        shell: bash
        run: |
          mkdir -p android-project

          ZIP=$(find . -maxdepth 2 -type f -name '*.zip' \
            ! -path './android-project/*' | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Android project ZIP not found"
            exit 1
          fi

          echo "Project ZIP: $ZIP"
          unzip -oq "$ZIP" -d android-project

      - name: Locate Android project
        shell: bash
        run: |
          PROJECT=$(find android-project \
            -type f -name settings.gradle \
            -printf '%h\n' | head
