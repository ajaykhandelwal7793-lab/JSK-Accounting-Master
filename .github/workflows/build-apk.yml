name: Build JSK Accounting Master APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "latest"
          accept-android-sdk-licenses: true

      - name: Install Android SDK Packages
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Locate Android Project
        shell: bash
        run: |
          PROJECT="$(find . -name settings.gradle -not -path './.git/*' -type f | head -n 1)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: settings.gradle not found."
            echo "Check that the Android project ZIP contains settings.gradle."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"
          echo "Found Android project: $(dirname "$PROJECT")"

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JSK-Accounting-Master-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
