name: Build JSK Accounting Master APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Android project
        run: |
          echo "Checking uploaded project"
          find . -maxdepth 4 -type f | head -100

      - name: Build APK
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Android Gradle project not found in repository root."
            echo "The uploaded ZIP must be extracted and project files placed correctly."
            exit 1
          fi
