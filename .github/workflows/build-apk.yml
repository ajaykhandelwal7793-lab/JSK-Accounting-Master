name: Build JSK Accounting Master APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Set up Android SDK
      - name: Install Android SDK Packages
        shell: bash
        run: | 
          set -e

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" \
              -type f -name sdkmanager -print -quit)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager executable not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
      # 4. Install Android SDK packages
      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" \
              -type f -name sdkmanager -print -quit)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager executable not found."
            find "${ANDROID_HOME}/cmdline-tools" \
              -maxdepth 5 -type f | head -50
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Set up Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 6. Extract Android project ZIP
      - name: Extract Android Project ZIP
        shell: bash
        run: |
          set -e
          mkdir -p android-project

          ZIP="$GITHUB_WORKSPACE/JSK_Accounting_Master_V43_Android_Project.zip"

          if [ ! -f "$ZIP" ]; then
            ZIP="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -name '*.zip' \
              -print -quit)"
          fi

          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "ERROR: Android project ZIP not found."
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          unzip -q "$ZIP" -d android-project

      # 7. Locate Android project
      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          PROJECT_FILE="$(find android-project -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            find android-project -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT="$(dirname "$PROJECT_FILE")"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT"

      # 8. Set application icon
      - name: Set JSK App Icon
        shell: bash
        run: |
          set -e

          ICON="$GITHUB_WORKSPACE/jsk_icon.png"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: jsk_icon.png not found in repository root."
            exit 1
          fi

          echo "Searching Android resource folder..."

          RES="$(find "$PROJECT" -type d \
            -path '*/src/main/res' -print -quit)"

          if [ -z "$RES" ] || [ ! -d "$RES" ]; then
            echo "ERROR: Android res folder not found."
            echo "Searching project files..."
            find "$PROJECT" -maxdepth 6 -type f | head -100
            exit 1
          fi

          echo "Resource folder found: $RES"

          sudo apt-get update
          sudo apt-get install -y imagemagick

          for SPEC in \
            "mdpi:48" \
            "hdpi:72" \
            "xhdpi:96" \
            "xxhdpi:144" \
            "xxxhdpi:192"
          do
            DENSITY="${SPEC%%:*}"
            SIZE="${SPEC##*:}"
            DIR="$RES/mipmap-$DENSITY"

            mkdir -p "$DIR"

            convert "$ICON" \
              -resize "${SIZE}x${SIZE}^" \
              -gravity center \
              -extent "${SIZE}x${SIZE}" \
              "$DIR/ic_launcher.png"

            cp "$DIR/ic_launcher.png" \
              "$DIR/ic_launcher_round.png"
          done

          echo "Launcher icons generated successfully."
      # 9. Configure manifest icon
      - name: Configure Manifest Icon
        shell: bash
        run: |
          set -e

          MANIFEST="$(find "$PROJECT" -type f \
            -path '*/src/main/AndroidManifest.xml' \
            -print -quit)"

          if [ -z "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          echo "Manifest: $MANIFEST"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          if re.search(r'<application\b[^>]*>', content):
              def update_application(match):
                  tag = match.group(0)

                  tag = re.sub(
                      r'\s+android:icon\s*=\s*"[^"]*"',
                      '',
                      tag
                  )

                  tag = re.sub(
                      r'\s+android:roundIcon\s*=\s*"[^"]*"',
                      '',
                      tag
                  )

                  tag = tag[:-1] + \
                      ' android:icon="@mipmap/ic_launcher"' \
                      ' android:roundIcon="@mipmap/ic_launcher_round">'

                  return tag

              content = re.sub(
                  r'<application\b[^>]*>',
                  update_application,
                  content,
                  count=1
              )
          else:
              raise SystemExit("ERROR: application tag not found.")

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Manifest launcher icon configured.")
          PY

      # 10. Build APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          gradle assembleDebug --no-daemon

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JSK-Accounting-Master-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
