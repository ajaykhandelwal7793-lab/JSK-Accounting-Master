name: Build JSK Accounting Master APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name '*.zip' | head -1)
          if [ -z "$ZIP" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          mkdir android-project
          unzip -q "$ZIP" -d android-project
          find android-project -maxdepth 4 -type f | head -100

      - name: Locate Gradle project
        run: |
          GRADLEW=$(find android-project -type f -name gradlew | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "No gradlew found. ZIP may not contain a complete Android Gradle project."
            exit 1
          fi
          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JSK-Accounting-Master-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
