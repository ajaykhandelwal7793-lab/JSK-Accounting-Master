name: Build JSK Accounting Master APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" \
              -type f -name sdkmanager -print -quit)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          "$SDKMANAGER" "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project ZIP
        shell: bash
        run: |
          mkdir -p android-project

          ZIP="$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: Android project ZIP not found"
            exit 1
          fi

          echo "ZIP found: $ZIP"
          unzip -q "$ZIP" -d android-project

      - name: Locate Android project
        shell: bash
        run: |
          PROJECT_FILE="$(find android-project -type f \
            \( -name settings.gradle -o \
               -name settings.gradle.kts \) -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            find android-project -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT="${PROJECT_FILE%/*}"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Project folder: $PROJECT"
     
      - name: Set JSK App Icon
        shell: bash
        run: |
          set -e
          ICON="$GITHUB_WORKSPACE/jsk_icon.png"
          if [ ! -f "$ICON" ]; then
            echo "Icon file not found: $ICON"
            exit 1
          fi
          echo "Icon file found: $ICON"
          find "$GITHUB_WORKSPACE" -type d -name res -path "*/src/main/res" -print
          
      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JSK-Accounting-Master-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
