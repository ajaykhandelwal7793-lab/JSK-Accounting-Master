name: Build JSK Accounting Master APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        shell: bash
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK Packages
        shell: bash
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android Project ZIP
        shell: bash
        run: |
          mkdir -p android-project

          ZIP="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -name 'JSK_Accounting_Master_V43_Android_Project.zip' \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            ZIP="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 2 \
              -type f \
              -name '*.zip' \
              -print -quit)"
          fi

          if [ -z "$ZIP" ]; then
            echo "ERROR: Android project ZIP not found."
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          unzip -q "$ZIP" -d android-project

      - name: Locate Android Project
        shell: bash
        run: |
          PROJECT_FILE="$(find android-project -type f \
            -name settings.gradle \
            -o -name settings.gradle.kts \
            -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            find android-project -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT="$(dirname "$PROJECT_FILE")"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT"

      - name: Set JSK App Icon
        shell: bash
        run: |
          set -e

          ICON="$GITHUB_WORKSPACE/jsk_icon.png"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: jsk_icon.png not found in repository root."
            exit 1
          fi

          echo "Icon found: $ICON"

          RES="$PROJECT/app/src/main/res"

          if [ ! -d "$RES" ]; then
            RES="$(find "$PROJECT" -type d \
              -path '*/src/main/res' -print -quit)"
          fi

          if [ -z "$RES" ] || [ ! -d "$RES" ]; then
            echo "ERROR: Android res folder not found."
            exit 1
          fi

          echo "Resource folder: $RES"

          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

          for SPEC in \
            "mdpi:48" \
            "hdpi:72" \
            "xhdpi:96" \
            "xxhdpi:144" \
            "xxxhdpi:192"
          do
            DENSITY="${SPEC%%:*}"
            SIZE="${SPEC##*:}"

            mkdir -p "$RES/mipmap-$DENSITY"

            convert "$ICON" \
              -resize "${SIZE}x${SIZE}^" \
              -gravity center \
              -extent "${SIZE}x${SIZE}" \
              "$RES/mipmap-$DENSITY/ic_launcher.png"

            convert "$ICON" \
              -resize "${SIZE}x${SIZE}^" \
              -gravity center \
              -extent "${SIZE}x${SIZE}" \
              "$RES/mipmap-$DENSITY/ic_launcher_round
