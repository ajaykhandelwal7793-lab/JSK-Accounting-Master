name: Build JSK Accounting Master APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager -print -quit)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager executable not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android Project ZIP
        shell: bash
        run: |
          set -e
          mkdir -p android-project

          ZIP="$GITHUB_WORKSPACE/JSK_Accounting_Master_V43_Android_Project.zip"

          if [ ! -f "$ZIP" ]; then
            ZIP="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 2 -type f -name '*.zip' -print -quit)"
          fi

          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "ERROR: Android project ZIP not found."
            exit 1
          fi

          unzip -q "$ZIP" -d android-project

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          PROJECT_FILE="$(find android-project -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          PROJECT="$(dirname "$PROJECT_FILE")"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT"

      - name: Set JSK App Icon
        shell: bash
        run: |
          set -e

          ICON="$GITHUB_WORKSPACE/jsk_icon.png"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: jsk_icon.png not found in repository root."
            exit 1
          fi

          RES="$(find "$PROJECT" -type d \
            -path '*/src/main/res' -print -quit)"

          if [ -z "$RES" ] || [ ! -d "$RES" ]; then
            echo "ERROR: Android res folder not found."
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y imagemagick

          for SPEC in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192
          do
            DENSITY="${SPEC%%:*}"
            SIZE="${SPEC##*:}"
            DIR="$RES/mipmap-$DENSITY"

            mkdir -p "$DIR"

            convert "$ICON" \
              -resize "${SIZE}x${SIZE}^" \
              -gravity center \
              -extent "${SIZE}x${SIZE}" \
              "$DIR/ic_launcher.png"

            cp "$DIR/ic_launcher.png" "$DIR/ic_launcher_round.png"
          done

          echo "Launcher icons generated."

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JSK-Accounting-Master-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
