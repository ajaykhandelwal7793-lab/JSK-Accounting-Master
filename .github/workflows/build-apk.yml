name: Build JSK Accounting Master APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -e
          mkdir -p android-project

          ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name '*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: Android project ZIP not found"
            exit 1
          fi

          echo "ZIP found: $ZIP"
          unzip -q "$ZIP" -d android-project

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_FILE="$(find android-project -type f \
            -name settings.gradle -o -name settings.gradle.kts \
            -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            find android-project -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT="${PROJECT_FILE%/*}"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Project folder: $PROJECT"

      - name: Set JSK App Icon
        shell: bash
        run: |
          set -e

          ICON="$GITHUB_WORKSPACE/jsk_icon.png"
          RES="$PROJECT/app/src/main/res"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: jsk_icon.png not found"
            exit 1
          fi

          if [ ! -d "$RES" ]; then
            RES="$(find "$PROJECT" -type d -path '*/src/main/res' -print -quit)"
          fi

          if [ -z "$RES" ] || [ ! -d "$RES" ]; then
            echo "ERROR: Android res folder not found"
            find "$PROJECT" -type d -name res -print
            exit 1
          fi

          echo "Android resources: $RES"

          python3 - "$ICON" "$RES" <<'PY'
          import sys
          from pathlib import Path
          from PIL import Image, ImageOps

          icon_path = Path(sys.argv[1])
          res = Path(sys.argv[2])

          image = Image.open(icon_path).convert("RGBA")
          image = ImageOps.fit(image, (512, 512), method=Image.Resampling.LANCZOS)

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
              target_dir = res / folder
              target_dir.mkdir(parents=True, exist_ok=True)
              image.resize
