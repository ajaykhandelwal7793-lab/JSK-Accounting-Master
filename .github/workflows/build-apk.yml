name: Build JSK Accounting Master APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" \
                     "build-tools;35.0.0" \
                     "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project ZIP
        run: |
          mkdir android-project
          ZIP=$(find . -maxdepth 2 -type f -name '*.zip' | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          unzip -q "$ZIP" -d android-project

      - name: Locate Android project
        run: |
          PROJECT=$(find android-project \
            -name settings.gradle \
            -type f -printf '%h\n' | head -1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JSK-Accounting-Master-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
